---

- name: Verify WinRM connection
  win_ping:
  register: winrm_result
  retries: 5
  delay: 15
  until: winrm_result.ping == "pong"
  ignore_errors: true

- name: Change the hostname
  win_hostname:
    name: "{{ windows_servers.hostname }}"
  register: hostname_result
  retries: 5
  delay: 15
  until: hostname_result is success
  ignore_errors: true

- name: Wait for hostname change to take effect
  win_wait_for:
    timeout: 120
    delay: 15
  ignore_errors: true

- name: reboot | Rebooting Server
  win_reboot:
    msg: "Reboot initiated by Ansible"
    connect_timeout: 120
    pre_reboot_delay: 30
    post_reboot_delay: 60
    reboot_timeout: 900
  register: reboot_result
  retries: 5
  delay: 30
  until: reboot_result is success
  ignore_errors: true

- name: Wait for WinRM to be available after reboot
  win_wait_for:
    port: 5985
    timeout: 300
    delay: 15
  ignore_errors: true